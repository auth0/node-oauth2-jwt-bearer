name: Scorecard analysis

# Runs OpenSSF Scorecard supply-chain analysis via ossf/scorecard-action and
# uploads the results to the Code Scanning dashboard. All action refs are
# SHA-pinned.
#
# • Scorecard scores the repository, not the diff, so it runs on push and
#   schedule on the default branch (the triggers OSSF supports).
# • persist-credentials: false on checkout is required by Scorecard.
# • publish_results: false keeps results private. Set it to true (and enable
#   id-token: write on the job) to publish to the public Scorecard API and
#   enable the badge.

on:
  push:
    branches: ['main']
  workflow_dispatch: {}
  schedule:
    - cron: '30 1 * * 6'   # weekly, Saturday 01:30 UTC

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to Code Scanning
      contents: read           # checkout the repository

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
