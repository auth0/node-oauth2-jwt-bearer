version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/access-token-jwt'
      - '/packages/oauth2-bearer'
      - '/packages/express-oauth2-jwt-bearer'
      - '/packages/examples'
    schedule:
      interval: 'weekly'
    groups:
      npm-dependencies:
        patterns:
          - '*'
        group-by: dependency-name
